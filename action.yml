name: 'Deploy'
description: 'Deploy to GCP cloudRun'
inputs:
  env:
    description: 'dev | qa | prod'
    required: true
  key:
    description: 'GCP service key base64 encoded'
    required: true
  serviceName:
    description: 'name of the service'
    required: true
  region:
    description: 'GCP region'
    required: false
    default: 'europe-west4'
  job:
    description: 'set to false if this service does not have a cloudrun-job that needs to be updated'
    required: false
    default: 'true'
  imageKey:
    description: 'the image key to be used to find the image'
    required: false
    default: 'all'
runs:
  using: "composite"
  steps:
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: nf-environment-${{ inputs.env }}
    - name: deploy ${{ inputs.env }}
      shell: bash
      env:
        ENV: ${{ inputs.env }}
        GCP_REGION: ${{ inputs.region }}
        GCP_NAME: ${{ inputs.serviceName }}
      run: |
        echo "Authenticate for docker"
        export BASE_REPO=${GCP_REGION}-docker.pkg.dev
        export CONTAINER_REPO=${BASE_REPO}/nf-artifact-repositories/${GCP_NAME}
        export CLOUDRUN_SERVICE=${GCP_NAME}-${ENV}
        export NEW_IMAGE=${CONTAINER_REPO}/${ENV}:${{ github.sha }}
        export IMG=${CONTAINER_REPO}/${{ inputs.imageKey }}:${{ github.sha }}
        
        echo ${{ inputs.key }} | base64 --decode > ${HOME}/gcloud-service-key.json
        gcloud auth activate-service-account --key-file=${HOME}/gcloud-service-key.json
        gcloud auth configure-docker --quiet $BASE_REPO
        
        echo "Wait until image push completed for ${IMG}"
        timeout 180 bash -c 'until gcloud container images describe ${IMG} > /dev/null 2>&1; do sleep 1; done'
        if [ "${IMG}" != "${NEW_IMAGE}" ]; then
          echo "Retagging ${IMG} to ${NEW_IMAGE}"
          gcloud container images add-tag -q ${IMG} ${NEW_IMAGE}
        fi
        
        echo "Updating the cloudRun service '${CLOUDRUN_SERVICE}'"
        gcloud run deploy ${CLOUDRUN_SERVICE} --image ${NEW_IMAGE} --region ${GCP_REGION}

        # Ensure all traffic serves the latest revision. `gcloud run deploy`
        # only moves traffic to the new revision when traffic is not pinned;
        # if it is pinned, the new revision is created serving 0%. Check the
        # percentage assigned to the latest revision and only update traffic
        # when it is not already at 100% (avoids a redundant call per deploy).
        LATEST_PERCENT=$(gcloud run services describe ${CLOUDRUN_SERVICE} \
          --region ${GCP_REGION} \
          --flatten='status.traffic[]' \
          --format='csv[no-heading](status.traffic.latestRevision,status.traffic.percent)' 2>/dev/null \
          | awk -F, 'tolower($1)=="true"{print $2; exit}')
        if [ "${LATEST_PERCENT:-0}" = "100" ]; then
          echo "Latest revision of '${CLOUDRUN_SERVICE}' already serves 100% of traffic — skipping update-traffic"
        else
          echo "Routing 100% of traffic to the latest revision of '${CLOUDRUN_SERVICE}' (latest currently at ${LATEST_PERCENT:-0}%)"
          gcloud run services update-traffic ${CLOUDRUN_SERVICE} --to-latest --region ${GCP_REGION} --quiet
        fi

        if [ "${{ inputs.job }}" = "true" ]; then
          gcloud run jobs update ${CLOUDRUN_SERVICE} --image ${NEW_IMAGE} --region ${GCP_REGION}
        fi
      
